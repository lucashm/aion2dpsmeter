[package]
name = "aion2-meter-windows"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/lucashm/daevalog"
homepage = "https://github.com/lucashm/daevalog"
description = "Native Windows desktop and overlay for Daevalog"

[features]
# Opt-in renderer capture for local visual QA; excluded from release packages.
ui-smoke = ["dep:image"]

# None of these dependencies enter the Linux desktop build.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
