name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Static musl binaries, so one download runs on any x86_64 distribution.
      - name: Build and package
        run: >
          docker run --rm -v "$PWD":/src -w /src -e OWNER="$(id -u):$(id -g)"
          rust:alpine sh scripts/package.sh "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/aion2-meter-$GITHUB_REF_NAME-x86_64-linux.tar.gz
          dist/aion2-meter-$GITHUB_REF_NAME-x86_64-linux.tar.gz.sha256
          --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
