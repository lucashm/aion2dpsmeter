[package]
name = "aion2-meterd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/lucashm/aion2dpsmeter"
homepage = "https://github.com/lucashm/aion2dpsmeter"
description = "Aion 2 combat capture daemon for Linux: sniffs the game's traffic and serves live DPS state to the overlay"

[dependencies]
# The parser core (packet framing, combat aggregation), without its Tauri app.
a2tools = { package = "a2tools-dps-meter", path = "../third_party/a2tools/src-tauri", default-features = false }
pcap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
