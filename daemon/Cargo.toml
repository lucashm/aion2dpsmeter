[package]
name = "aion2-meterd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/lucashm/daevalog"
homepage = "https://github.com/lucashm/daevalog"
description = "Daevalog combat capture daemon for Linux and Windows"

[dependencies]
# The parser core (packet framing, combat aggregation), without its Tauri app.
a2tools = { package = "a2tools-dps-meter", path = "../third_party/a2tools/src-tauri", default-features = false }
pcap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
